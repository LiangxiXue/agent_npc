    <text x="150" y="624" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#475569">timing breakdown · arc evidence · ambient arc signals · final outcome</text>
  </g>

  <g id="footer">
    <text x="56" y="674" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="12" fill="#64748B">Source: course_report_zh.md · 2.4 / 3.7 Traveler runtime 与 timeline export</text>
