    <text x="778" y="486" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#17324D">Reflect</text>

    <line x1="640" y1="207" x2="704" y2="207" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="704,207 694,201 694,213" fill="#94A3B8"/>
    <line x1="852" y1="207" x2="916" y2="207" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="916,207 906,201 906,213" fill="#94A3B8"/>
    <line x1="990" y1="236" x2="990" y2="450" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="990,450 984,440 996,440" fill="#94A3B8"/>
    <line x1="916" y1="479" x2="852" y2="479" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="852,479 862,473 862,485" fill="#94A3B8"/>
    <line x1="704" y1="479" x2="566" y2="479" stroke="#94A3B8" stroke-width="2"/>
    <line x1="566" y1="479" x2="566" y2="236" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="566,236 560,246 572,246" fill="#94A3B8"/>
  </g>

  <g id="export-fields">
    <rect x="72" y="568" width="1136" height="58" rx="8" fill="#EEF4FA" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/timeline" x="100" y="581" width="32" height="32" fill="#1D4E89" stroke-width="2"/>
    <text x="150" y="591" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#17324D">Timeline 导出字段</text>
