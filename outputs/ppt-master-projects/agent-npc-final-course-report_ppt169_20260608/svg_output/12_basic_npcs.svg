<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <image href="../template_assets/pku_logo_cropped.png" x="1020" y="24" width="220" height="72" preserveAspectRatio="xMidYMid meet"/>
  <rect x="0" y="68" width="82" height="68" fill="#A40012"/>
  <text x="92" y="104" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="34" font-weight="bold" fill="#000000">基础 NPC 设定：三类角色支撑可信世界</text>
  <text x="92" y="136" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="24" fill="#333333">先建立普通角色的职责边界，再说明 Sable 为什么是特殊路线节点</text>

  <rect x="92" y="194" width="330" height="318" fill="#F7F7F7" stroke="#D9D9D9"/>
  <text x="124" y="244" font-family='"DengXian", Arial, sans-serif' font-size="28" font-weight="bold" fill="#A40012">Lina：酒馆老板</text>
  <text x="124" y="292" font-family='"DengXian", Arial, sans-serif' font-size="21" font-weight="bold" fill="#000000">功能定位</text>
  <text x="124" y="328" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">信息交汇点与入口保护者</text>
  <text x="124" y="370" font-family='"DengXian", Arial, sans-serif' font-size="21" font-weight="bold" fill="#000000">决策依据</text>
  <text x="124" y="406" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">观察玩家是否可信、是否急于</text>
  <text x="124" y="432" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">获取敏感遗迹信息</text>
  <text x="124" y="474" font-family='"DengXian", Arial, sans-serif' font-size="18" fill="#666666">代表机制：lost_key / trust gate</text>

  <rect x="474" y="194" width="330" height="318" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="506" y="244" font-family='"DengXian", Arial, sans-serif' font-size="28" font-weight="bold" fill="#A40012">Ron：城镇守卫</text>
  <text x="506" y="292" font-family='"DengXian", Arial, sans-serif' font-size="21" font-weight="bold" fill="#000000">功能定位</text>
  <text x="506" y="328" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">公共安全、巡逻记录与证据门控</text>
  <text x="506" y="370" font-family='"DengXian", Arial, sans-serif' font-size="21" font-weight="bold" fill="#000000">决策依据</text>
  <text x="506" y="406" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">时间、地点、见证人、徽章号</text>
  <text x="506" y="432" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">等可核验材料</text>
  <text x="506" y="474" font-family='"DengXian", Arial, sans-serif' font-size="18" fill="#666666">代表机制：gate_badge / guard log</text>

  <rect x="856" y="194" width="330" height="318" fill="#FFF1E5" stroke="#D9D9D9"/>
  <text x="888" y="244" font-family='"DengXian", Arial, sans-serif' font-size="28" font-weight="bold" fill="#A40012">Mira：遗迹学者</text>
  <text x="888" y="292" font-family='"DengXian", Arial, sans-serif' font-size="21" font-weight="bold" fill="#000000">功能定位</text>
  <text x="888" y="328" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">研究解释、田野笔记与证据整理</text>
  <text x="888" y="370" font-family='"DengXian", Arial, sans-serif' font-size="21" font-weight="bold" fill="#000000">决策依据</text>
  <text x="888" y="406" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">一手观察、符号细节、地点</text>
  <text x="888" y="432" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">和不确定性的标注</text>
  <text x="888" y="474" font-family='"DengXian", Arial, sans-serif' font-size="18" fill="#666666">代表机制：ancient_notes / field notes</text>

  <line x1="92" y1="558" x2="1188" y2="558" stroke="#D9D9D9"/>
  <text x="92" y="600" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#000000">共同点：</text>
  <text x="208" y="600" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="24" fill="#333333">三位 NPC 都有清晰职责、记忆边界和可验证行动条件。</text>
  <text x="92" y="636" font-family='"DengXian", Arial, sans-serif' font-size="18" fill="#666666">对比基础：Sable 的特殊性不在于“更强”，而在于它会把非正式信息渠道转化为路线优势。</text>
  <text x="1180" y="692" text-anchor="end" font-family='"DengXian", Arial, sans-serif' font-size="14" fill="#666666">12</text>
</svg>
