    <text x="702" y="330" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#17324D">Traveler</text>
    <text x="702" y="360" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#475569">profile-constrained LLM loop</text>

    <rect x="492" y="178" width="148" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="566" y="214" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#17324D">Observe</text>

