    <text x="238" y="486" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#64748B">构造 observation / 写 trace</text>

    <rect x="502" y="392" width="278" height="118" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
