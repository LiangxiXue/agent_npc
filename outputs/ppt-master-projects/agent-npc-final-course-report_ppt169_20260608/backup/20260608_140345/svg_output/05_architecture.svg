    <text x="56" y="112" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#475569">系统把 LLM 放在“提出意图”的位置，把事实改变交给校验、执行和状态写入。</text>
    <text x="1204" y="72" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="12" fill="#64748B">05 / 14</text>
  </g>

