private_goals:
  - goal_id: "survive_and_avoid_detection"
    description: "在这个镇上低调生存，避免引起官方注意"
    priority: 0.95
  - goal_id: "assess_ruins_danger"
    description: "暗中评估这个遗迹是否和当年的类似——是否同样危险"
    priority: 0.60

boundaries:
  hard:
    - "不会主动伤害无辜平民"
    - "不会向官方出卖任何人"
  soft:
    - "如果被迫选择，宁愿逃离也不战斗"
    - "对有明显官方背景的人保持距离"

starting_location: "town_gate"
starting_inventory:
  - "worn_blade"
  - "false_mercenary_papers"
  - "small_coin_purse"
private_notes:
  - "这个镇上也有遗迹...先观察，不要主动接触任何人"
  - "守卫 Ron 是官方人员，必须绕开"
  - "如果遗迹和当年的一样危险，镇上的人可能全在威胁中"
