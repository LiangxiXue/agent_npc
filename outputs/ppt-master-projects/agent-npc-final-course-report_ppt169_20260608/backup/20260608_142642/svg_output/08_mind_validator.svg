<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <image href="../template_assets/image1.png" x="1030" y="20" width="205" height="72" preserveAspectRatio="xMidYMid meet"/>
  <rect x="0" y="68" width="82" height="68" fill="#A40012"/>
  <text x="92" y="104" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="34" font-weight="bold" fill="#000000">NPCMind + ActionValidator：自由表达，受控执行</text>
  <text x="92" y="136" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="24" fill="#333333">角色可以有主观状态，但世界事实必须经过规则边界</text>

  <g id="two-sides">
    <rect x="104" y="208" width="440" height="286" fill="#F7F7F7" stroke="#D9D9D9"/>
    <text x="136" y="260" font-family='"DengXian", Arial, sans-serif' font-size="30" font-weight="bold" fill="#A40012">NPCMind</text>
    <text x="136" y="318" font-family='"DengXian", Arial, sans-serif' font-size="23" fill="#000000">belief：角色相信什么</text>
    <text x="136" y="358" font-family='"DengXian", Arial, sans-serif' font-size="23" fill="#000000">emotion：当前情绪倾向</text>
    <text x="136" y="398" font-family='"DengXian", Arial, sans-serif' font-size="23" fill="#000000">goal / plan：下一步策略</text>
    <text x="136" y="448" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">让角色回复前先形成可记录的主观判断。</text>

    <rect x="736" y="208" width="440" height="286" fill="#FFF1E5" stroke="#D9D9D9"/>
    <text x="768" y="260" font-family='"DengXian", Arial, sans-serif' font-size="30" font-weight="bold" fill="#A40012">ActionValidator</text>
    <text x="768" y="318" font-family='"DengXian", Arial, sans-serif' font-size="23" fill="#000000">检查 action 是否存在</text>
    <text x="768" y="358" font-family='"DengXian", Arial, sans-serif' font-size="23" fill="#000000">检查任务、地点、物品条件</text>
    <text x="768" y="398" font-family='"DengXian", Arial, sans-serif' font-size="23" fill="#000000">阻止或修复越界输出</text>
    <text x="768" y="448" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#333333">确保自然语言不能直接改写数据库事实。</text>
  </g>

  <line x1="544" y1="351" x2="736" y2="351" stroke="#BFBFBF" stroke-width="2"/>
  <polygon points="736,351 726,345 726,357" fill="#BFBFBF"/>
  <text x="640" y="333" text-anchor="middle" font-family='"DengXian", Arial, sans-serif' font-size="20" fill="#666666">decision</text>

  <line x1="92" y1="568" x2="1188" y2="568" stroke="#D9D9D9"/>
  <text x="92" y="610" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#000000">设计效果：</text>
  <text x="220" y="610" font-family='"DengXian", "Microsoft YaHei", Arial, sans-serif' font-size="24" fill="#333333">保留角色语言的灵活性，同时避免一句自然语言直接改变世界事实。</text>
  <text x="1180" y="692" text-anchor="end" font-family='"DengXian", Arial, sans-serif' font-size="14" fill="#666666">8</text>
</svg>
