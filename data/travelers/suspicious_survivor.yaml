  cover_story: "刚从北方边境退伍，想在镇上找份护卫差事糊口"
  private_background: "曾奉命看守一处遗迹挖掘点，目睹上级为了古物灭口整支小队，从此不信任任何官方组织"

motivations:
  curiosity: 0.35
  wealth: 0.40
  prestige: 0.10
  safety: 0.95
  loyalty: 0.30
  truth_seeking: 0.50
  power: 0.10

personality:
  cautious: 0.85
  bold: 0.40
  empathetic: 0.25
  suspicious: 0.90
  patient: 0.55
  manipulative: 0.25

social_tendencies:
  default_honesty: 0.40
  trusts_authority: 0.05
  trusts_scholars: 0.25
  trusts_merchants: 0.10
  willing_to_lie: 0.70
  willing_to_share_info: 0.20
