<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
    <rect x="0" y="0" width="1280" height="14" fill="#1D4E89"/>
  </g>

  <g id="header">
    <text x="56" y="72" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="34" font-weight="bold" fill="#17324D">Traveler Runtime：用 profile 驱动自动探索</text>
    <text x="56" y="112" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#475569">Traveler 是 living-world simulation 中可配置的自动探索角色，而不是普通玩家输入。</text>
    <text x="1204" y="72" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="12" fill="#64748B">10 / 14</text>
  </g>

  <g id="profile-card">
    <rect x="72" y="164" width="348" height="366" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="72" y="164" width="348" height="54" rx="8" fill="#EEF4FA"/>
    <use data-icon="tabler-outline/route" x="104" y="176" width="34" height="34" fill="#1D4E89" stroke-width="2"/>
    <text x="154" y="198" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#17324D">YAML Profile</text>
    <text x="104" y="256" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#1F2937">
      <tspan x="104" dy="0">公开身份：角色如何自我介绍</tspan>
      <tspan x="104" dy="34">私人目标：探索偏好与动机</tspan>
      <tspan x="104" dy="34">隐藏信息：不能直接暴露的背景</tspan>
      <tspan x="104" dy="34">行动边界：允许移动、询问、检查</tspan>
      <tspan x="104" dy="34">探索风格：求真、谨慎或追求声望</tspan>
    </text>
    <rect x="104" y="444" width="284" height="54" rx="8" fill="#FFF3D6" stroke="#CBD5E1"/>
    <text x="246" y="478" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#B7791F">profile 会改变路线选择</text>
  </g>

  <g id="loop-diagram">
